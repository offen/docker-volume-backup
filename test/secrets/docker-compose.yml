services:
  storage:
    image: versity/versitygw:v1.8.0
    environment:
      ROOT_ACCESS_KEY: test
      ROOT_SECRET_KEY: GMusLtUmILge2by+z890kQ
      VGW_BACKEND: posix
      VGW_BACKEND_ARGS: /data
    entrypoint: /bin/sh -c 'mkdir -p /data/backup && /usr/local/bin/docker-entrypoint.sh'
    volumes:
      - storage_data:/data

  backup:
    image: offen/docker-volume-backup:${TEST_VERSION:-canary}
    depends_on:
      - storage
    deploy:
      restart_policy:
        condition: on-failure
    environment:
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/storage_root_user
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/storage_root_password
      AWS_ENDPOINT: storage:7070
      AWS_ENDPOINT_PROTO: http
      AWS_S3_BUCKET_NAME: backup
      BACKUP_FILENAME: test.tar.gz
      BACKUP_CRON_EXPRESSION: 0 0 5 31 2 ?
      BACKUP_RETENTION_DAYS: 7
      BACKUP_PRUNING_LEEWAY: 5s
    volumes:
      - pg_data:/backup/pg_data:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    secrets:
      - storage_root_user
      - storage_root_password

  offen:
    image: offen/offen:latest
    labels:
      - docker-volume-backup.stop-during-backup=true
    healthcheck:
      disable: true
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  pg:
    image: postgres:14-alpine
    environment:
      POSTGRES_PASSWORD: example
    labels:
      - docker-volume-backup.stop-during-backup=true
    volumes:
      - pg_data:/var/lib/postgresql/data
    deploy:
      restart_policy:
        condition: on-failure

volumes:
  storage_data:
    name: storage_data
  pg_data:
    name: pg_data

secrets:
  storage_root_user:
    external: true
  storage_root_password:
    external: true
