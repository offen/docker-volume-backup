services:
  storage:
    image: versity/versitygw:v1.8.0
    environment:
      ROOT_ACCESS_KEY: test
      ROOT_SECRET_KEY: GMusLtUmILge2by+z890kQ
      VGW_BACKEND: posix
      VGW_BACKEND_ARGS: /data
    entrypoint: /bin/sh -c 'mkdir -p /data/backup && /usr/local/bin/docker-entrypoint.sh'
    volumes:
      - ${LOCAL_DIR:-local}:/data

  backup:
    image: offen/docker-volume-backup:${TEST_VERSION:-canary}
    user: 1000:1000
    depends_on:
      - storage
    restart: always
    volumes:
      - app_data:/backup/app_data:ro
      - ./01conf.env:/etc/dockervolumebackup/conf.d/01conf.env

  offen:
    image: offen/offen:latest
    labels:
      - docker-volume-backup.stop-during-backup=true
    volumes:
      - app_data:/var/opt/offen

volumes:
  app_data:
